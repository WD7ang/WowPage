<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.author.name | default: site.name | escape }} | {{ page.title | escape }}</title>
  <meta name="description" content="{{ page.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/images/placeholders/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/cv.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script src="{{ '/assets/js/academic.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</head>
<body class="cv-page">
  <a class="skip-link" href="#cv-name">Skip to content</a>
  <main id="layout-content">{{ content }}</main>
</body>
</html>
