---
layout: academic
---
<article class="essay-reader" lang="{{ page.lang | default: 'zh-CN' }}">
  <header class="essay-heading">
    <a class="essay-back" href="{{ '/#essays' | relative_url }}">← 回到随笔 <span lang="en">/ Back to essays</span></a>
    <p class="eyebrow">随笔 · <span lang="en">Essays</span></p>
    <h1>{{ page.title | escape }}{% if page.title_en %}<span class="essay-title-en" lang="en">{{ page.title_en | escape }}</span>{% endif %}</h1>
    <p class="essay-meta">{{ page.author | default: site.author.name | escape }} <span aria-hidden="true">/</span> <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y.%m.%d' }}</time></p>
    <nav class="essay-language-nav" aria-label="正文语言 / Reading language"><a href="#essay-zh" lang="zh-CN">中文</a><a href="#essay-en" lang="en">English</a></nav>
  </header>
  <div class="essay-content">{{ content }}</div>
  <footer class="essay-end"><span aria-hidden="true">✦</span><a href="{{ '/#blog' | relative_url }}">回到书架 <span lang="en">/ Back to the bookshelf</span> ↗</a></footer>
</article>
