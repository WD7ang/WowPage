<h1 class="main-heading">Hi there <img class="intro-wave" src="{{ '/images/Hi.gif' | relative_url }}" width="32" height="32" alt=""> Welcome to my Homepage!</h1>
{{ site.data.profile.intro_html }}
{% if site.data.profile.interests.size > 0 %}
<div class="research-interests" role="group" aria-labelledby="research-interests-label">
  <span class="research-caption" id="research-interests-label">Research interests</span>
  <div class="research-tags">
    {% for interest in site.data.profile.interests %}
    <span class="research-topic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 1M7 7l4 11m6-10-6 10"/><circle cx="7" cy="7" r="3"/><circle cx="17" cy="8" r="3"/><circle cx="11" cy="18" r="3"/></svg>{{ interest | escape }}</span>
    {% endfor %}
  </div>
</div>
{% endif %}
