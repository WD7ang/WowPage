# Identity: edit this section first. Empty social fields are hidden.
locale: en-US
title: Academic Homepage
title_separator: "·"
name: &name "Your Name"
description: "Research, publications, projects, and notes from Your Name."
# Leave these unset for GitHub Pages auto-discovery, or set explicit values.
url: # https://your-username.github.io (no trailing slash)
baseurl: # "" for username.github.io; /repository-name for a project site
repository: # your-username/your-repository
author:
  name: *name
  avatar: placeholders/avatar.svg # relative to images/
  bio: "Researcher · Your research area"
  location: "City, Country"
  email: "name@example.com"
  uri: # full URL
  pronouns:
  twitter: "your_username" # replace with your username
  googlescholar: "https://scholar.google.com/citations?user=YOUR_SCHOLAR_ID" # full profile URL
  github: "your-github-username" # replace with your username
  orcid:
  linkedin: # username
  WeChat: # image filename relative to images/

# Rendering and defaults. Content lives in _data/ and _posts/.
timezone: Etc/UTC
future: false
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  auto_ids: true
  toc_levels: 1..6
  syntax_highlighter: rouge
excerpt_separator: "<!--more-->"
permalink: /blog/:year/:month/:day/:title/
words_per_minute: 160
breadcrumbs: false
read_more: disabled
comments:
  provider: false
analytics:
  provider: false
atom_feed:
  hide: false
include:
  - _pages
exclude:
  - .github
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CHANGELOG.md
  - docs
  - scripts
  - node_modules
  - package.json
  - package-lock.json
  - local
  - vendor
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: posts
    values:
      layout: academic-post
      author_profile: false
      comments: false
      share: false
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
compress_html:
  clippings: all
  ignore:
    envs: development
